name: Feature proposal
description: Propose a concrete improvement and its acceptance criteria.
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the workflow and why current behavior is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How would a contributor demonstrate this is complete?
    validations:
      required: true
