name: Cross-Runner Reproducibility

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to package and compare (e.g. v1.0.0-rc.1)'
        required: true
        default: 'v1.0.0-rc.1'

permissions:
  contents: read

jobs:
  build-ubuntu-22:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes make
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install cargo tools
        run: |
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_HOME
          mkdir -p "$CARGO_HOME/bin"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo install cargo-audit --locked --version 0.22.2
          curl -fsSL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny" "$CARGO_HOME/bin/"
          curl -fsSL https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about" "$CARGO_HOME/bin/"
          curl -fsSL https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9/cargo-cyclonedx-x86_64-unknown-linux-musl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cargo-cyclonedx-x86_64-unknown-linux-musl/cargo-cyclonedx" "$CARGO_HOME/bin/"
          curl -fsSL https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 -o "$CARGO_HOME/bin/cyclonedx"
          chmod +x "$CARGO_HOME/bin/cyclonedx"
      - run: npm ci --prefix cli
      - run: bash scripts/package-linux.sh "${{ inputs.version }}" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ubuntu-22
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  build-ubuntu-24:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes make
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install cargo tools
        run: |
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_HOME
          mkdir -p "$CARGO_HOME/bin"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo install cargo-audit --locked --version 0.22.2
          curl -fsSL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny" "$CARGO_HOME/bin/"
          curl -fsSL https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about" "$CARGO_HOME/bin/"
          curl -fsSL https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9/cargo-cyclonedx-x86_64-unknown-linux-musl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cargo-cyclonedx-x86_64-unknown-linux-musl/cargo-cyclonedx" "$CARGO_HOME/bin/"
          curl -fsSL https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 -o "$CARGO_HOME/bin/cyclonedx"
          chmod +x "$CARGO_HOME/bin/cyclonedx"
      - run: npm ci --prefix cli
      - run: bash scripts/package-linux.sh "${{ inputs.version }}" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ubuntu-24
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  compare:
    needs: [build-ubuntu-22, build-ubuntu-24]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-ubuntu-22
          path: /tmp/dist-ubuntu-22
      - uses: actions/download-artifact@v4
        with:
          name: dist-ubuntu-24
          path: /tmp/dist-ubuntu-24
      - name: Compare cross-runner packages (ACC-SUP-08, REQ-REL-114)
        run: |
          VERSION="${{ inputs.version }}"
          ARCHIVE="nexus-linux-x86_64-$VERSION.tar.gz"
          cmp "/tmp/dist-ubuntu-22/$ARCHIVE" "/tmp/dist-ubuntu-24/$ARCHIVE"
          cmp "/tmp/dist-ubuntu-22/SHA256SUMS" "/tmp/dist-ubuntu-24/SHA256SUMS"
          cmp "/tmp/dist-ubuntu-22/THIRD_PARTY_NOTICES.txt" "/tmp/dist-ubuntu-24/THIRD_PARTY_NOTICES.txt"
          cmp "/tmp/dist-ubuntu-22/sbom.cdx.json" "/tmp/dist-ubuntu-24/sbom.cdx.json"
          cmp "/tmp/dist-ubuntu-22/install.sh" "/tmp/dist-ubuntu-24/install.sh"
          echo "CROSS_RUNNER_REPRO_PASS: All artifacts byte-identical across ubuntu-22.04 and ubuntu-24.04."
