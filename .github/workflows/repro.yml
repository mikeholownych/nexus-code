name: Cross-runner RC reproducibility

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published RC tag with lock-pinned release tools (for example v1.1.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rc-repro-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    runs-on: ubuntu-22.04
    outputs:
      tag_sha: ${{ steps.resolve.outputs.tag_sha }}
      workflow_sha: ${{ steps.resolve.outputs.workflow_sha }}
    env:
      TARGET_TAG: ${{ inputs.tag }}
    steps:
      - name: Require dispatch from main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Dispatch this workflow from main so the checked workflow is the reviewed release version." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
      - id: resolve
        name: Resolve published RC tag to an immutable commit
        run: |
          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            echo "Expected a vX.Y.Z-rc.N tag; received an invalid tag." >&2
            exit 1
          fi
          git fetch origin main --no-tags
          git fetch origin "refs/tags/$TARGET_TAG:refs/tags/$TARGET_TAG"
          tag_sha="$(git rev-parse "$TARGET_TAG^{commit}")"
          git merge-base --is-ancestor "$tag_sha" origin/main
          git checkout --detach "$tag_sha"
          test "$(node -p 'require("./package.json").version')" = "${TARGET_TAG#v}"
          node scripts/sync-version.mjs --check --tag "$TARGET_TAG"
          test -f "docs/releases/$TARGET_TAG.md"
          if [[ ! -s scripts/release-tools/package.json || ! -s scripts/release-tools/package-lock.json ]] || \
             ! grep -Fq 'scripts/release-tools/package-lock.json' scripts/package-linux.sh || \
             ! grep -Fq 'check_deprecated_lock.mjs' scripts/package-linux.sh || \
             grep -Eq '(^|[[:space:]])npx([[:space:]]|$)' scripts/package-linux.sh scripts/generate_sbom.sh; then
            echo "The selected RC predates or bypasses the locked notices tool and lock deprecation gate; cross-runner reproduction requires an RC whose tag includes them." >&2
            exit 1
          fi
          printf 'tag_sha=%s\n' "$tag_sha" >> "$GITHUB_OUTPUT"
          printf 'workflow_sha=%s\n' "$GITHUB_WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify the public RC release is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TARGET_TAG" --json isPrerelease,isDraft \
            | jq -e '.isPrerelease == true and .isDraft == false' >/dev/null

  build:
    needs: resolve-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    env:
      TARGET_TAG: ${{ inputs.tag }}
      EXPECTED_TAG_SHA: ${{ needs.resolve-tag.outputs.tag_sha }}
      EXPECTED_WORKFLOW_SHA: ${{ needs.resolve-tag.outputs.workflow_sha }}
      NEXUS_BUILD_CONTAINER_IMAGE: rust:1.95.0-bookworm@sha256:4c2fd73ef19c5ef9d54bee03b06b2839a392604fbfcd578ed948b71b37c1d7fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Require the pinned release Node and npm versions
        run: |
          test "$(node --version)" = "v22.22.1"
          test "$(npm --version)" = "10.9.4"
      - name: Verify exact RC source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_TAG_SHA"
          test "$(node -p 'require("./package.json").version')" = "${TARGET_TAG#v}"
          node scripts/sync-version.mjs --check --tag "$TARGET_TAG"
          test "$GITHUB_REF" = refs/heads/main
      - run: sudo apt-get update && sudo apt-get install --yes acl make bubblewrap build-essential meson ninja-build pkg-config libcap-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned Rust toolchain action
        with:
          toolchain: 1.95.0
      - name: Install pinned SBOM and notices tools
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_HOME="$cargo_home"
          mkdir -p "$CARGO_HOME/bin"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          curl -fsSL https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about" "$CARGO_HOME/bin/"
          curl -fsSL https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9/cargo-cyclonedx-x86_64-unknown-linux-musl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cargo-cyclonedx-x86_64-unknown-linux-musl/cargo-cyclonedx" "$CARGO_HOME/bin/"
          curl -fsSL https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 -o "$CARGO_HOME/bin/cyclonedx"
          chmod +x "$CARGO_HOME/bin/cyclonedx"
      - name: Verify the pinned package builder is available
        run: |
          docker info >/dev/null
          test "$NEXUS_BUILD_CONTAINER_IMAGE" = 'rust:1.95.0-bookworm@sha256:4c2fd73ef19c5ef9d54bee03b06b2839a392604fbfcd578ed948b71b37c1d7fb'
      - name: Build the exact RC package
        env:
          NEXUS_PACKAGE_TOOL_COMMIT: ${{ needs.resolve-tag.outputs.workflow_sha }}
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$NEXUS_PACKAGE_TOOL_COMMIT" origin/main
          package_tool="$RUNNER_TEMP/package-linux.sh"
          git show "$NEXUS_PACKAGE_TOOL_COMMIT:scripts/package-linux.sh" > "$package_tool"
          NEXUS_PACKAGE_SOURCE="$GITHUB_WORKSPACE" bash "$package_tool" "$TARGET_TAG" "$RUNNER_TEMP/dist"
      - name: Record source, toolchain, and published-asset identity
        env:
          NEXUS_PACKAGE_TOOL_COMMIT: ${{ needs.resolve-tag.outputs.workflow_sha }}
          NEXUS_PACKAGE_TOOL_SCRIPT: ${{ runner.temp }}/package-linux.sh
        run: |
          git show "$EXPECTED_WORKFLOW_SHA:scripts/repro-identity.mjs" > "$RUNNER_TEMP/repro-identity.mjs"
          node "$RUNNER_TEMP/repro-identity.mjs" record "$TARGET_TAG" "$RUNNER_TEMP/dist" \
            "$RUNNER_TEMP/dist/repro-identity.json" "${{ matrix.runner }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-repro-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/dist/nexus-linux-x86_64-${{ inputs.tag }}.tar.gz
            ${{ runner.temp }}/dist/compatibility.json
            ${{ runner.temp }}/dist/SHA256SUMS
            ${{ runner.temp }}/dist/THIRD_PARTY_NOTICES.txt
            ${{ runner.temp }}/dist/sbom.cdx.json
            ${{ runner.temp }}/dist/install.sh
            ${{ runner.temp }}/dist/repro-identity.json
          if-no-files-found: error
          retention-days: 14

  compare:
    needs: [resolve-tag, build]
    runs-on: ubuntu-22.04
    env:
      TARGET_TAG: ${{ inputs.tag }}
      EXPECTED_TAG_SHA: ${{ needs.resolve-tag.outputs.tag_sha }}
      EXPECTED_WORKFLOW_SHA: ${{ needs.resolve-tag.outputs.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify comparison code is the exact reviewed workflow commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_WORKFLOW_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexus-repro-ubuntu-22.04
          path: ${{ runner.temp }}/ubuntu-22.04
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexus-repro-ubuntu-24.04
          path: ${{ runner.temp }}/ubuntu-24.04
      - name: Download published RC assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="nexus-linux-x86_64-$TARGET_TAG.tar.gz"
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$TARGET_TAG" \
            --pattern "$archive" \
            --pattern compatibility.json \
            --pattern SHA256SUMS \
            --pattern THIRD_PARTY_NOTICES.txt \
            --pattern sbom.cdx.json \
            --pattern install.sh \
            --dir "$RUNNER_TEMP/published"
      - name: Compare both runner builds with each other and the published RC
        run: |
          archive="nexus-linux-x86_64-$TARGET_TAG.tar.gz"
          for runner in ubuntu-22.04 ubuntu-24.04; do
            (cd "$RUNNER_TEMP/$runner" && sha256sum --check SHA256SUMS)
          done
          (cd "$RUNNER_TEMP/published" && sha256sum --check SHA256SUMS)
          for file in "$archive" compatibility.json SHA256SUMS THIRD_PARTY_NOTICES.txt sbom.cdx.json install.sh; do
            cmp "$RUNNER_TEMP/ubuntu-22.04/$file" "$RUNNER_TEMP/ubuntu-24.04/$file"
            cmp "$RUNNER_TEMP/ubuntu-22.04/$file" "$RUNNER_TEMP/published/$file"
          done
          node scripts/repro-identity.mjs compare "$TARGET_TAG" "$EXPECTED_TAG_SHA" "$EXPECTED_WORKFLOW_SHA" \
            "$RUNNER_TEMP/repro-evidence.json" \
            "$RUNNER_TEMP/ubuntu-22.04/repro-identity.json" \
            "$RUNNER_TEMP/ubuntu-24.04/repro-identity.json"
          archive_sha="$(sha256sum "$RUNNER_TEMP/ubuntu-22.04/$archive" | cut -d' ' -f1)"
          {
            printf '## Cross-runner RC reproducibility: %s\n\n' "$TARGET_TAG"
            printf 'Source commit: %s\n' "$EXPECTED_TAG_SHA"
            printf 'Runner images: ubuntu-22.04 and ubuntu-24.04\n'
            printf 'Both runner outputs match each other and the six selected reproducibility artifacts.\n'
            printf 'Archive SHA-256: %s\n' "$archive_sha"
            printf '\nReproducibility evidence artifact: repro-evidence.json\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-repro-evidence-${{ inputs.tag }}
          path: ${{ runner.temp }}/repro-evidence.json
          if-no-files-found: error
          retention-days: 90
