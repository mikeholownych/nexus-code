name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install --yes make bubblewrap
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --prefix cli
      - run: npm --prefix cli run build
      - run: cargo test --locked --manifest-path core/Cargo.toml
      - run: cargo build --locked --release --manifest-path core/Cargo.toml --bin harness-core --bin nexus-tui
      - run: npm --prefix cli test
      - run: bash scripts/security_gates.sh
      - run: bash scripts/package-linux.sh "v$(node -p 'require("./package.json").version')" "$RUNNER_TEMP/dist"
      - run: bash scripts/smoke-package.sh "$RUNNER_TEMP/dist/nexus-linux-x86_64-v$(node -p 'require("./package.json").version).tar.gz"
      - run: bash scripts/installer-smoke.sh "$GITHUB_WORKSPACE/install.sh" "$RUNNER_TEMP/dist/nexus-linux-x86_64-v$(node -p 'require("./package.json").version).tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-x86_64
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
