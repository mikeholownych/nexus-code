# Build and test every branch: the Rust engine and TUI, the TypeScript CLI, the PTY scenarios and the security gates
# (`make test` runs all three suites). One job, because the tests need the release binaries built in the same tree.
stages:
  - test

variables:
  NODE_VERSION: "24.21.0"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"

build-and-test:
  stage: test
  # Rust 1.85+ is needed for edition 2024.
  image: rust:1.89-bookworm
  cache:
    key:
      files:
        - core/Cargo.lock
        - cli/package-lock.json
    paths:
      - .cargo-home/
      - .npm-cache/
      - core/target/
  before_script:
    # python3 drives the PTY scenarios; util-linux provides `script` for the REPL pty tests.
    - apt-get update -qq && apt-get install -y -qq python3 util-linux xz-utils > /dev/null
    - curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" | tar -xJ -C /usr/local --strip-components=1
    - export PATH="$CARGO_HOME/bin:$PATH"
    - command -v cargo-audit > /dev/null || cargo install cargo-audit --locked --quiet
    - npm --prefix cli ci
  script:
    - node --version && cargo --version
    - make build
    - node cli/dist/index.js --version
    - make test
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - cli/dist/
      - core/target/release/nexus-tui
      - core/target/release/harness-core
