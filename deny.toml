[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[advisories]
ignore = []
