[package]
name = "harness-core"
version = "1.2.1"
edition = "2024"

[[bin]]
name = "harness-core"
path = "src/main.rs"

[[bin]]
name = "nexus-tui"
path = "src/bin/nexus_tui.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
ignore = "0.4"
regex = "1.10"
similar = { version = "2.6", features = ["text"] }
memmap2 = "0.9.11"
portable-pty = "0.9.0"
tokio = { version = "1.53.1", features = ["full"] }
git2 = "0.21.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
